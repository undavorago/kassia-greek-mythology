<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Просмотр кабинета на разных экранах</title><style>body{margin:0;background:#c7c9c1;color:#222;font:14px Arial}header{padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff}button,select,a{padding:10px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#244d98;color:#fff}main{padding:20px;overflow:auto}iframe{display:block;width:390px;height:844px;border:0;margin:auto;background:#f2efdf;box-shadow:0 4px 25px #0003}</style></head><body><header><label>Страница <select id="page"><option value="index.html">Главная</option><option value="catalog.html">Каталог</option><option value="lectures/lesson-01.html">Лекция</option></select></label><button data-width="390" data-height="844" aria-pressed="true">Телефон 390</button><button data-width="768" data-height="1024" aria-pressed="false">Планшет 768</button><button data-width="1440" data-height="1000" aria-pressed="false">Компьютер 1440</button><a href="index.html">Открыть сайт</a></header><main><iframe id="frame" title="Кабинет в выбранном размере" src="index.html"></iframe></main><script>const frame=document.querySelector('#frame');document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width=b.dataset.width+'px';frame.style.height=b.dataset.height+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></body></html>
